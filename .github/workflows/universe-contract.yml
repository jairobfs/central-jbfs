name: Universo JBFS · Testes de contrato Craft

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/universe-craft.ts'
      - 'tests/universe-craft.mjs'
      - 'lib/universe-fsrs.ts'
      - 'tests/universe-fsrs.mjs'
      - '.github/workflows/universe-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  craft-read-only:
    name: Integridade, URL segura e nenhuma escrita
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Executar testes isolados (sem credenciais)
        run: node --experimental-strip-types --test tests/universe-craft.mjs tests/universe-fsrs.mjs
